    &lt;article id=&quot;agentledger&quot; class=&quot;case-study reveal&quot; data-project&gt;&lt;div class=&quot;case-copy&quot;&gt;&lt;div class=&quot;case-kicker&quot;&gt;&lt;span&gt;01&lt;/span&gt;&lt;span&gt;AI Agents · FinTech&lt;/span&gt;&lt;/div&gt;&lt;h3&gt;AgentLedger&lt;/h3&gt;&lt;p class=&quot;case-summary&quot;&gt;An idempotent, x402-inspired Razorpay settlement gateway for autonomous AI agents.&lt;/p&gt;&lt;dl class=&quot;case-facts&quot;&gt;&lt;div&gt;&lt;dt&gt;Problem&lt;/dt&gt;&lt;dd&gt;Payment flows assume a human checkout and provide weak protection against duplicate agent retries.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;System&lt;/dt&gt;&lt;dd&gt;HTTP 402 challenges, budget checks, signed webhooks, a deterministic state machine, and a hash-chained audit ledger.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Status&lt;/dt&gt;&lt;dd&gt;Test-mode and mock-ready buildathon implementation; explicitly not presented as live-money production.&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class=&quot;tech-list&quot; aria-label=&quot;Technologies&quot;&gt;&lt;span&gt;Next.js 16&lt;/span&gt;&lt;span&gt;TypeScript&lt;/span&gt;&lt;span&gt;Prisma&lt;/span&gt;&lt;span&gt;SQLite&lt;/span&gt;&lt;span&gt;Razorpay&lt;/span&gt;&lt;span&gt;Tailwind CSS&lt;/span&gt;&lt;/div&gt;&lt;a class=&quot;project-link&quot; href=&quot;https://github.com/iamshivam017/AgentLedger&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;system-frame ledger-frame&quot; aria-label=&quot;AgentLedger payment flow diagram&quot;&gt;&lt;div class=&quot;frame-label&quot;&gt;&lt;span&gt;Settlement flow&lt;/span&gt;&lt;span&gt;Idempotent by design&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-canvas&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;flow-node&quot;&gt;&lt;small&gt;REQUEST&lt;/small&gt;&lt;strong&gt;AI Agent&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;flow-arrow&quot;&gt;&lt;span&gt;402&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-node focus&quot;&gt;&lt;small&gt;CONTROL&lt;/small&gt;&lt;strong&gt;Gateway&lt;/strong&gt;&lt;em&gt;budget · state · signature&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;flow-arrow&quot;&gt;&lt;span&gt;verify&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-stack&quot;&gt;&lt;div&gt;Razorpay&lt;/div&gt;&lt;div&gt;Ledger&lt;/div&gt;&lt;div&gt;Audit log&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;detail-toggle&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;agentledger-detail&quot;&gt;Engineering detail &lt;span aria-hidden=&quot;true&quot;&gt;+&lt;/span&gt;&lt;/button&gt;&lt;div id=&quot;agentledger-detail&quot; class=&quot;detail-panel&quot; hidden&gt;&lt;p&gt;Three idempotency layers protect settlement: database uniqueness, service-level guards, and webhook event deduplication. Raw-body HMAC verification protects the webhook boundary.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
    &lt;article id=&quot;agentshield&quot; class=&quot;case-study reverse reveal&quot; data-project&gt;&lt;div class=&quot;case-copy&quot;&gt;&lt;div class=&quot;case-kicker&quot;&gt;&lt;span&gt;02&lt;/span&gt;&lt;span&gt;Applied ML · Risk Systems&lt;/span&gt;&lt;/div&gt;&lt;h3&gt;AgentShield AI&lt;/h3&gt;&lt;p class=&quot;case-summary&quot;&gt;A defense-first risk and trust layer that evaluates autonomous-agent payments before money moves.&lt;/p&gt;&lt;dl class=&quot;case-facts&quot;&gt;&lt;div&gt;&lt;dt&gt;Problem&lt;/dt&gt;&lt;dd&gt;An agent can submit a technically valid payment that still violates its owner’s mandate or behavioral pattern.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;System&lt;/dt&gt;&lt;dd&gt;Behavioral features, calibrated anomaly modeling, deterministic policy enforcement, and explainable ALLOW, VERIFY, or BLOCK decisions.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Evidence&lt;/dt&gt;&lt;dd&gt;The repository documents a reproducible held-out synthetic benchmark and clearly labels it as synthetic—not customer data.&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class=&quot;tech-list&quot; aria-label=&quot;Technologies&quot;&gt;&lt;span&gt;Python&lt;/span&gt;&lt;span&gt;FastAPI&lt;/span&gt;&lt;span&gt;Machine Learning&lt;/span&gt;&lt;span&gt;Policy Engine&lt;/span&gt;&lt;span&gt;Docker&lt;/span&gt;&lt;/div&gt;&lt;a class=&quot;project-link&quot; href=&quot;https://github.com/iamshivam017/AgentShield-AI&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;system-frame risk-frame&quot; aria-label=&quot;AgentShield evaluation pipeline diagram&quot;&gt;&lt;div class=&quot;frame-label&quot;&gt;&lt;span&gt;Evaluation pipeline&lt;/span&gt;&lt;span&gt;Decision before settlement&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;risk-pipeline&quot; aria-hidden=&quot;true&quot;&gt;&lt;div&gt;&lt;small&gt;01&lt;/small&gt;&lt;strong&gt;Context&lt;/strong&gt;&lt;span&gt;agent · merchant · velocity&lt;/span&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div class=&quot;focus&quot;&gt;&lt;small&gt;02&lt;/small&gt;&lt;strong&gt;Risk model&lt;/strong&gt;&lt;span&gt;behavioral anomaly score&lt;/span&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div&gt;&lt;small&gt;03&lt;/small&gt;&lt;strong&gt;Policy&lt;/strong&gt;&lt;span&gt;deterministic thresholds&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;decision-strip&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;ALLOW&lt;/span&gt;&lt;span&gt;VERIFY&lt;/span&gt;&lt;span&gt;BLOCK&lt;/span&gt;&lt;/div&gt;&lt;button class=&quot;detail-toggle&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;agentshield-detail&quot;&gt;Engineering detail &lt;span aria-hidden=&quot;true&quot;&gt;+&lt;/span&gt;&lt;/button&gt;&lt;div id=&quot;agentshield-detail&quot; class=&quot;detail-panel&quot; hidden&gt;&lt;p&gt;The model contributes a risk signal; deterministic rules retain final authority. This separation keeps decisions auditable and prevents the model from directly moving money.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
    &lt;article id=&quot;credit-risk&quot; class=&quot;case-study reveal&quot; data-project&gt;&lt;div class=&quot;case-copy&quot;&gt;&lt;div class=&quot;case-kicker&quot;&gt;&lt;span&gt;03&lt;/span&gt;&lt;span&gt;Machine Learning · Explainability&lt;/span&gt;&lt;/div&gt;&lt;h3&gt;Credit Risk Predictor&lt;/h3&gt;&lt;p class=&quot;case-summary&quot;&gt;A reproducible ML pipeline that predicts loan approval priority while exposing a misleading data-leakage feature.&lt;/p&gt;&lt;dl class=&quot;case-facts&quot;&gt;&lt;div&gt;&lt;dt&gt;Problem&lt;/dt&gt;&lt;dd&gt;Bank and CIBIL records must be cleaned, merged, and modeled without relying on a feature unavailable in production.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;System&lt;/dt&gt;&lt;dd&gt;Two clearly labeled feature sets compare the leakage-inflated model with a deployable XGBoost model aligned to the holdout schema.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Product&lt;/dt&gt;&lt;dd&gt;A Streamlit dashboard supports single and batch prediction, model comparison, SHAP explainability, and the leakage investigation.&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class=&quot;tech-list&quot; aria-label=&quot;Technologies&quot;&gt;&lt;span&gt;Python&lt;/span&gt;&lt;span&gt;Pandas&lt;/span&gt;&lt;span&gt;XGBoost&lt;/span&gt;&lt;span&gt;SHAP&lt;/span&gt;&lt;span&gt;Streamlit&lt;/span&gt;&lt;span&gt;pytest&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;project-actions&quot;&gt;&lt;a class=&quot;project-link&quot; href=&quot;https://github.com/iamshivam017/Credit-Risk-Predictor&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;project-link&quot; href=&quot;https://credit-risks-prediction.streamlit.app/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Live demo &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;system-frame credit-frame&quot; aria-label=&quot;Credit risk machine learning pipeline diagram&quot;&gt;&lt;div class=&quot;frame-label&quot;&gt;&lt;span&gt;Data to decision&lt;/span&gt;&lt;span&gt;Leakage-aware pipeline&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ml-pipeline&quot; aria-hidden=&quot;true&quot;&gt;&lt;div&gt;&lt;small&gt;DATA&lt;/small&gt;&lt;strong&gt;Bank + CIBIL&lt;/strong&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div&gt;&lt;small&gt;CHECK&lt;/small&gt;&lt;strong&gt;Schema + leakage&lt;/strong&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div class=&quot;focus&quot;&gt;&lt;small&gt;MODEL&lt;/small&gt;&lt;strong&gt;XGBoost&lt;/strong&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div&gt;&lt;small&gt;EXPLAIN&lt;/small&gt;&lt;strong&gt;SHAP&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;model-note&quot;&gt;&lt;span&gt;51 features&lt;/span&gt;&lt;del&gt;Inflated by unavailable signal&lt;/del&gt;&lt;strong&gt;50 features&lt;/strong&gt;&lt;em&gt;Deployment-aligned model&lt;/em&gt;&lt;/div&gt;&lt;button class=&quot;detail-toggle&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;credit-detail&quot;&gt;Engineering detail &lt;span aria-hidden=&quot;true&quot;&gt;+&lt;/span&gt;&lt;/button&gt;&lt;div id=&quot;credit-detail&quot; class=&quot;detail-panel&quot; hidden&gt;&lt;p&gt;The project deliberately rejects the visually impressive 99.2% leakage-inflated result and uses the lower, reproducible deployment model for predictions. The repository documents limitations rather than hiding them.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
  &lt;/div&gt;&lt;/section&gt;
  &lt;section id=&quot;capabilities&quot; class=&quot;capabilities-section shell&quot; aria-labelledby=&quot;capabilities-title&quot;&gt;&lt;header class=&quot;section-intro compact&quot;&gt;&lt;div&gt;&lt;span class=&quot;section-number&quot;&gt;02&lt;/span&gt;&lt;h2 id=&quot;capabilities-title&quot;&gt;Capabilities grounded in projects.&lt;/h2&gt;&lt;/div&gt;&lt;p&gt;Technologies are useful when they connect to a real system. These are the areas repeatedly demonstrated across the work above.&lt;/p&gt;&lt;/header&gt;&lt;div class=&quot;capability-grid&quot;&gt;&lt;article&gt;&lt;span&gt;02.1&lt;/span&gt;&lt;h3&gt;AI Agents&lt;/h3&gt;&lt;p&gt;Workflows, tool use, orchestration, and agentic commerce.&lt;/p&gt;&lt;small&gt;AgentLedger · SafeSpend&lt;/small&gt;&lt;/article&gt;&lt;article&gt;&lt;span&gt;02.2&lt;/span&gt;&lt;h3&gt;AI / ML&lt;/h3&gt;&lt;p&gt;Machine learning, NLP, model integration, and explainability.&lt;/p&gt;&lt;small&gt;AgentShield · Credit Risk · ReviewLens&lt;/small&gt;&lt;/article&gt;&lt;article&gt;&lt;span&gt;02.3&lt;/span&gt;&lt;h3&gt;Software Engineering&lt;/h3&gt;&lt;p&gt;Full-stack applications, APIs, databases, frontend and backend systems.&lt;/p&gt;&lt;small&gt;Next.js · FastAPI · Python · TypeScript&lt;/small&gt;&lt;/article&gt;&lt;article&gt;&lt;span&gt;02.4&lt;/span&gt;&lt;h3&gt;Web3&lt;/h3&gt;&lt;p&gt;Blockchain applications, agentic payments, and protocol-oriented infrastructure.&lt;/p&gt;&lt;small&gt;x402 · Solana exploration · dApps&lt;/small&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;section id=&quot;experience&quot; class=&quot;experience-section&quot; aria-labelledby=&quot;experience-title&quot;&gt;&lt;div class=&quot;shell experience-inner&quot;&gt;&lt;div&gt;&lt;span class=&quot;section-number light&quot;&gt;03&lt;/span&gt;&lt;h2 id=&quot;experience-title&quot;&gt;Education &amp;amp;&lt;br&gt;development.&lt;/h2&gt;&lt;p&gt;Formal study and focused programs strengthening an applied engineering foundation.&lt;/p&gt;&lt;/div&gt;&lt;ol class=&quot;timeline&quot;&gt;&lt;li&gt;&lt;span&gt;2023—2027&lt;/span&gt;&lt;strong&gt;Indian Institute of Technology Guwahati&lt;/strong&gt;&lt;p&gt;B.Sc. in Data Science &amp;amp; AI&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span&gt;Currently enrolled&lt;/span&gt;&lt;strong&gt;AWS AI &amp;amp; ML Scholars&lt;/strong&gt;&lt;p&gt;Focused learning in artificial intelligence and machine learning.&lt;/p&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;section class=&quot;more-work shell&quot; aria-labelledby=&quot;more-work-title&quot;&gt;&lt;div class=&quot;section-row&quot;&gt;&lt;span class=&quot;section-number&quot;&gt;04&lt;/span&gt;&lt;h2 id=&quot;more-work-title&quot;&gt;Additional work&lt;/h2&gt;&lt;a href=&quot;https://github.com/iamshivam017?tab=repositories&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;GitHub archive &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;work-index-head&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;Project&lt;/span&gt;&lt;span&gt;Focus&lt;/span&gt;&lt;span&gt;Stack&lt;/span&gt;&lt;span&gt;Links&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;work-list&quot;&gt;&lt;article id=&quot;safespend&quot; class=&quot;work-row&quot;&gt;&lt;div&gt;&lt;span&gt;AI Agents · Personal Finance&lt;/span&gt;&lt;h3&gt;SafeSpend&lt;/h3&gt;&lt;/div&gt;&lt;p&gt;Evidence-aware affordability agent that evaluates cash flow, essential spending, and payment options before recommending proceed, wait, or decline.&lt;/p&gt;&lt;div class=&quot;compact-stack&quot; aria-label=&quot;Technologies&quot;&gt;Python · Agent workflows · Evidence processing · Tests&lt;/div&gt;&lt;div class=&quot;row-actions&quot;&gt;&lt;a href=&quot;https://github.com/iamshivam017/SafeSpend&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository ↗&lt;/a&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;work-row&quot;&gt;&lt;div&gt;&lt;span&gt;Applied NLP&lt;/span&gt;&lt;h3&gt;ReviewLens&lt;/h3&gt;&lt;/div&gt;&lt;p&gt;Sentiment analysis and insight dashboard trained on real customer-review data.&lt;/p&gt;&lt;div class=&quot;compact-stack&quot; aria-label=&quot;Technologies&quot;&gt;Python · NLP · Streamlit&lt;/div&gt;&lt;div class=&quot;row-actions&quot;&gt;&lt;a href=&quot;https://github.com/iamshivam017/ReviewLens&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository ↗&lt;/a&gt;&lt;a href=&quot;https://reviewlens-iitg.streamlit.app/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Live demo ↗&lt;/a&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;section id=&quot;about&quot; class=&quot;about-section shell&quot; aria-labelledby=&quot;about-title&quot;&gt;&lt;div&gt;&lt;span class=&quot;section-number&quot;&gt;05&lt;/span&gt;&lt;h2 id=&quot;about-title&quot;&gt;Building what’s next, responsibly.&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;about-copy&quot;&gt;&lt;p&gt;I’m Kumar Shivam, a B.Sc. Data Science &amp;amp; AI student at IIT Guwahati focused on AI/ML, software engineering, AI agents, and Web3.&lt;/p&gt;&lt;p&gt;I enjoy turning emerging technologies into working products—from agentic payment infrastructure and financial AI systems to full-stack software and decentralized systems. My approach is simple: understand the problem, make the system inspectable, and be honest about what the evidence proves.&lt;/p&gt;&lt;/div&gt;&lt;dl class=&quot;about-facts&quot;&gt;&lt;div&gt;&lt;dt&gt;Based in&lt;/dt&gt;&lt;dd&gt;Bengaluru, India&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Focus&lt;/dt&gt;&lt;dd&gt;AI agents · Applied ML&lt;br&gt;Software engineering · Web3&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Working style&lt;/dt&gt;&lt;dd&gt;Product-minded&lt;br&gt;Evidence-led&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;/section&gt;

    &lt;article id=&quot;agentledger&quot; class=&quot;case-study reveal&quot; data-project&gt;&lt;div class=&quot;case-copy&quot;&gt;&lt;div class=&quot;case-kicker&quot;&gt;&lt;span&gt;01&lt;/span&gt;&lt;span&gt;AI Agents · FinTech&lt;/span&gt;&lt;/div&gt;&lt;h3&gt;AgentLedger&lt;/h3&gt;&lt;p class=&quot;case-summary&quot;&gt;An idempotent, x402-inspired Razorpay settlement gateway for autonomous AI agents.&lt;/p&gt;&lt;dl class=&quot;case-facts&quot;&gt;&lt;div&gt;&lt;dt&gt;Problem&lt;/dt&gt;&lt;dd&gt;Payment flows assume a human checkout and provide weak protection against duplicate agent retries.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;System&lt;/dt&gt;&lt;dd&gt;HTTP 402 challenges, budget checks, signed webhooks, a deterministic state machine, and a hash-chained audit ledger.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Status&lt;/dt&gt;&lt;dd&gt;Test-mode and mock-ready buildathon implementation; explicitly not presented as live-money production.&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class=&quot;tech-list&quot; aria-label=&quot;Technologies&quot;&gt;&lt;span&gt;Next.js 16&lt;/span&gt;&lt;span&gt;TypeScript&lt;/span&gt;&lt;span&gt;Prisma&lt;/span&gt;&lt;span&gt;SQLite&lt;/span&gt;&lt;span&gt;Razorpay&lt;/span&gt;&lt;span&gt;Tailwind CSS&lt;/span&gt;&lt;/div&gt;&lt;a class=&quot;project-link&quot; href=&quot;https://github.com/iamshivam017/AgentLedger&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;system-frame ledger-frame&quot; aria-label=&quot;AgentLedger payment flow diagram&quot;&gt;&lt;div class=&quot;frame-label&quot;&gt;&lt;span&gt;Settlement flow&lt;/span&gt;&lt;span&gt;Idempotent by design&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-canvas&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;flow-node&quot;&gt;&lt;small&gt;REQUEST&lt;/small&gt;&lt;strong&gt;AI Agent&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;flow-arrow&quot;&gt;&lt;span&gt;402&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-node focus&quot;&gt;&lt;small&gt;CONTROL&lt;/small&gt;&lt;strong&gt;Gateway&lt;/strong&gt;&lt;em&gt;budget · state · signature&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;flow-arrow&quot;&gt;&lt;span&gt;verify&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-stack&quot;&gt;&lt;div&gt;Razorpay&lt;/div&gt;&lt;div&gt;Ledger&lt;/div&gt;&lt;div&gt;Audit log&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;detail-toggle&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;agentledger-detail&quot;&gt;Engineering detail &lt;span aria-hidden=&quot;true&quot;&gt;+&lt;/span&gt;&lt;/button&gt;&lt;div id=&quot;agentledger-detail&quot; class=&quot;detail-panel&quot; hidden&gt;&lt;p&gt;Three idempotency layers protect settlement: database uniqueness, service-level guards, and webhook event deduplication. Raw-body HMAC verification protects the webhook boundary.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
    &lt;article id=&quot;agentshield&quot; class=&quot;case-study reverse reveal&quot; data-project&gt;&lt;div class=&quot;case-copy&quot;&gt;&lt;div class=&quot;case-kicker&quot;&gt;&lt;span&gt;02&lt;/span&gt;&lt;span&gt;Applied ML · Risk Systems&lt;/span&gt;&lt;/div&gt;&lt;h3&gt;AgentShield AI&lt;/h3&gt;&lt;p class=&quot;case-summary&quot;&gt;A defense-first risk and trust layer that evaluates autonomous-agent payments before money moves.&lt;/p&gt;&lt;dl class=&quot;case-facts&quot;&gt;&lt;div&gt;&lt;dt&gt;Problem&lt;/dt&gt;&lt;dd&gt;An agent can submit a technically valid payment that still violates its owner’s mandate or behavioral pattern.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;System&lt;/dt&gt;&lt;dd&gt;Behavioral features, calibrated anomaly modeling, deterministic policy enforcement, and explainable ALLOW, VERIFY, or BLOCK decisions.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Evidence&lt;/dt&gt;&lt;dd&gt;The repository documents a reproducible held-out synthetic benchmark and clearly labels it as synthetic—not customer data.&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class=&quot;tech-list&quot; aria-label=&quot;Technologies&quot;&gt;&lt;span&gt;Python&lt;/span&gt;&lt;span&gt;FastAPI&lt;/span&gt;&lt;span&gt;Machine Learning&lt;/span&gt;&lt;span&gt;Policy Engine&lt;/span&gt;&lt;span&gt;Docker&lt;/span&gt;&lt;/div&gt;&lt;a class=&quot;project-link&quot; href=&quot;https://github.com/iamshivam017/AgentShield-AI&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;system-frame risk-frame&quot; aria-label=&quot;AgentShield evaluation pipeline diagram&quot;&gt;&lt;div class=&quot;frame-label&quot;&gt;&lt;span&gt;Evaluation pipeline&lt;/span&gt;&lt;span&gt;Decision before settlement&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;risk-pipeline&quot; aria-hidden=&quot;true&quot;&gt;&lt;div&gt;&lt;small&gt;01&lt;/small&gt;&lt;strong&gt;Context&lt;/strong&gt;&lt;span&gt;agent · merchant · velocity&lt;/span&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div class=&quot;focus&quot;&gt;&lt;small&gt;02&lt;/small&gt;&lt;strong&gt;Risk model&lt;/strong&gt;&lt;span&gt;behavioral anomaly score&lt;/span&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div&gt;&lt;small&gt;03&lt;/small&gt;&lt;strong&gt;Policy&lt;/strong&gt;&lt;span&gt;deterministic thresholds&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;decision-strip&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;ALLOW&lt;/span&gt;&lt;span&gt;VERIFY&lt;/span&gt;&lt;span&gt;BLOCK&lt;/span&gt;&lt;/div&gt;&lt;button class=&quot;detail-toggle&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;agentshield-detail&quot;&gt;Engineering detail &lt;span aria-hidden=&quot;true&quot;&gt;+&lt;/span&gt;&lt;/button&gt;&lt;div id=&quot;agentshield-detail&quot; class=&quot;detail-panel&quot; hidden&gt;&lt;p&gt;The model contributes a risk signal; deterministic rules retain final authority. This separation keeps decisions auditable and prevents the model from directly moving money.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
    &lt;article id=&quot;credit-risk&quot; class=&quot;case-study reveal&quot; data-project&gt;&lt;div class=&quot;case-copy&quot;&gt;&lt;div class=&quot;case-kicker&quot;&gt;&lt;span&gt;03&lt;/span&gt;&lt;span&gt;Machine Learning · Explainability&lt;/span&gt;&lt;/div&gt;&lt;h3&gt;Credit Risk Predictor&lt;/h3&gt;&lt;p class=&quot;case-summary&quot;&gt;A reproducible ML pipeline that predicts loan approval priority while exposing a misleading data-leakage feature.&lt;/p&gt;&lt;dl class=&quot;case-facts&quot;&gt;&lt;div&gt;&lt;dt&gt;Problem&lt;/dt&gt;&lt;dd&gt;Bank and CIBIL records must be cleaned, merged, and modeled without relying on a feature unavailable in production.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;System&lt;/dt&gt;&lt;dd&gt;Two clearly labeled feature sets compare the leakage-inflated model with a deployable XGBoost model aligned to the holdout schema.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Product&lt;/dt&gt;&lt;dd&gt;A Streamlit dashboard supports single and batch prediction, model comparison, SHAP explainability, and the leakage investigation.&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class=&quot;tech-list&quot; aria-label=&quot;Technologies&quot;&gt;&lt;span&gt;Python&lt;/span&gt;&lt;span&gt;Pandas&lt;/span&gt;&lt;span&gt;XGBoost&lt;/span&gt;&lt;span&gt;SHAP&lt;/span&gt;&lt;span&gt;Streamlit&lt;/span&gt;&lt;span&gt;pytest&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;project-actions&quot;&gt;&lt;a class=&quot;project-link&quot; href=&quot;https://github.com/iamshivam017/Credit-Risk-Predictor&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;project-link&quot; href=&quot;https://credit-risks-prediction.streamlit.app/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Live demo &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;system-frame credit-frame&quot; aria-label=&quot;Credit risk machine learning pipeline diagram&quot;&gt;&lt;div class=&quot;frame-label&quot;&gt;&lt;span&gt;Data to decision&lt;/span&gt;&lt;span&gt;Leakage-aware pipeline&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ml-pipeline&quot; aria-hidden=&quot;true&quot;&gt;&lt;div&gt;&lt;small&gt;DATA&lt;/small&gt;&lt;strong&gt;Bank + CIBIL&lt;/strong&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div&gt;&lt;small&gt;CHECK&lt;/small&gt;&lt;strong&gt;Schema + leakage&lt;/strong&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div class=&quot;focus&quot;&gt;&lt;small&gt;MODEL&lt;/small&gt;&lt;strong&gt;XGBoost&lt;/strong&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div&gt;&lt;small&gt;EXPLAIN&lt;/small&gt;&lt;strong&gt;SHAP&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;model-note&quot;&gt;&lt;span&gt;51 features&lt;/span&gt;&lt;del&gt;Inflated by unavailable signal&lt;/del&gt;&lt;strong&gt;50 features&lt;/strong&gt;&lt;em&gt;Deployment-aligned model&lt;/em&gt;&lt;/div&gt;&lt;button class=&quot;detail-toggle&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;credit-detail&quot;&gt;Engineering detail &lt;span aria-hidden=&quot;true&quot;&gt;+&lt;/span&gt;&lt;/button&gt;&lt;div id=&quot;credit-detail&quot; class=&quot;detail-panel&quot; hidden&gt;&lt;p&gt;The project deliberately rejects the visually impressive 99.2% leakage-inflated result and uses the lower, reproducible deployment model for predictions. The repository documents limitations rather than hiding them.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
  &lt;/div&gt;&lt;/section&gt;
  &lt;section id=&quot;capabilities&quot; class=&quot;capabilities-section shell&quot; aria-labelledby=&quot;capabilities-title&quot;&gt;&lt;header class=&quot;section-intro compact&quot;&gt;&lt;div&gt;&lt;span class=&quot;section-number&quot;&gt;02&lt;/span&gt;&lt;h2 id=&quot;capabilities-title&quot;&gt;Capabilities grounded in projects.&lt;/h2&gt;&lt;/div&gt;&lt;p&gt;Technologies are useful when they connect to a real system. These are the areas repeatedly demonstrated across the work above.&lt;/p&gt;&lt;/header&gt;&lt;div class=&quot;capability-grid&quot;&gt;&lt;article&gt;&lt;span&gt;02.1&lt;/span&gt;&lt;h3&gt;AI Agents&lt;/h3&gt;&lt;p&gt;Workflows, tool use, orchestration, and agentic commerce.&lt;/p&gt;&lt;small&gt;AgentLedger · SafeSpend&lt;/small&gt;&lt;/article&gt;&lt;article&gt;&lt;span&gt;02.2&lt;/span&gt;&lt;h3&gt;AI / ML&lt;/h3&gt;&lt;p&gt;Machine learning, NLP, model integration, and explainability.&lt;/p&gt;&lt;small&gt;AgentShield · Credit Risk · ReviewLens&lt;/small&gt;&lt;/article&gt;&lt;article&gt;&lt;span&gt;02.3&lt;/span&gt;&lt;h3&gt;Software Engineering&lt;/h3&gt;&lt;p&gt;Full-stack applications, APIs, databases, frontend and backend systems.&lt;/p&gt;&lt;small&gt;Next.js · FastAPI · Python · TypeScript&lt;/small&gt;&lt;/article&gt;&lt;article&gt;&lt;span&gt;02.4&lt;/span&gt;&lt;h3&gt;Web3&lt;/h3&gt;&lt;p&gt;Blockchain applications, agentic payments, and protocol-oriented infrastructure.&lt;/p&gt;&lt;small&gt;x402 · Solana exploration · dApps&lt;/small&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;section id=&quot;experience&quot; class=&quot;experience-section&quot; aria-labelledby=&quot;experience-title&quot;&gt;&lt;div class=&quot;shell experience-inner&quot;&gt;&lt;div&gt;&lt;span class=&quot;section-number light&quot;&gt;03&lt;/span&gt;&lt;h2 id=&quot;experience-title&quot;&gt;Education &amp;amp;&lt;br&gt;development.&lt;/h2&gt;&lt;p&gt;Formal study and focused programs strengthening an applied engineering foundation.&lt;/p&gt;&lt;/div&gt;&lt;ol class=&quot;timeline&quot;&gt;&lt;li&gt;&lt;span&gt;2023—2027&lt;/span&gt;&lt;strong&gt;Indian Institute of Technology Guwahati&lt;/strong&gt;&lt;p&gt;B.Sc. in Data Science &amp;amp; AI&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span&gt;Currently enrolled&lt;/span&gt;&lt;strong&gt;AWS AI &amp;amp; ML Scholars&lt;/strong&gt;&lt;p&gt;Focused learning in artificial intelligence and machine learning.&lt;/p&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;section class=&quot;more-work shell&quot; aria-labelledby=&quot;more-work-title&quot;&gt;&lt;div class=&quot;section-row&quot;&gt;&lt;span class=&quot;section-number&quot;&gt;04&lt;/span&gt;&lt;h2 id=&quot;more-work-title&quot;&gt;Additional work&lt;/h2&gt;&lt;a href=&quot;https://github.com/iamshivam017?tab=repositories&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;GitHub archive &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;work-index-head&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;Project&lt;/span&gt;&lt;span&gt;Focus&lt;/span&gt;&lt;span&gt;Stack&lt;/span&gt;&lt;span&gt;Links&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;work-list&quot;&gt;&lt;article id=&quot;safespend&quot; class=&quot;work-row&quot;&gt;&lt;div&gt;&lt;span&gt;AI Agents · Personal Finance&lt;/span&gt;&lt;h3&gt;SafeSpend&lt;/h3&gt;&lt;/div&gt;&lt;p&gt;Evidence-aware affordability agent that evaluates cash flow, essential spending, and payment options before recommending proceed, wait, or decline.&lt;/p&gt;&lt;div class=&quot;compact-stack&quot; aria-label=&quot;Technologies&quot;&gt;Python · Agent workflows · Evidence processing · Tests&lt;/div&gt;&lt;div class=&quot;row-actions&quot;&gt;&lt;a href=&quot;https://github.com/iamshivam017/SafeSpend&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository ↗&lt;/a&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;work-row&quot;&gt;&lt;div&gt;&lt;span&gt;Applied NLP&lt;/span&gt;&lt;h3&gt;ReviewLens&lt;/h3&gt;&lt;/div&gt;&lt;p&gt;Sentiment analysis and insight dashboard trained on real customer-review data.&lt;/p&gt;&lt;div class=&quot;compact-stack&quot; aria-label=&quot;Technologies&quot;&gt;Python · NLP · Streamlit&lt;/div&gt;&lt;div class=&quot;row-actions&quot;&gt;&lt;a href=&quot;https://github.com/iamshivam017/ReviewLens&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository ↗&lt;/a&gt;&lt;a href=&quot;https://reviewlens-iitg.streamlit.app/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Live demo ↗&lt;/a&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;section id=&quot;about&quot; class=&quot;about-section shell&quot; aria-labelledby=&quot;about-title&quot;&gt;&lt;div&gt;&lt;span class=&quot;section-number&quot;&gt;05&lt;/span&gt;&lt;h2 id=&quot;about-title&quot;&gt;Building what’s next, responsibly.&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;about-copy&quot;&gt;&lt;p&gt;I’m Kumar Shivam, a B.Sc. Data Science &amp;amp; AI student at IIT Guwahati focused on AI/ML, software engineering, AI agents, and Web3.&lt;/p&gt;&lt;p&gt;I enjoy turning emerging technologies into working products—from agentic payment infrastructure and financial AI systems to full-stack software and decentralized systems. My approach is simple: understand the problem, make the system inspectable, and be honest about what the evidence proves.&lt;/p&gt;&lt;/div&gt;&lt;dl class=&quot;about-facts&quot;&gt;&lt;div&gt;&lt;dt&gt;Based in&lt;/dt&gt;&lt;dd&gt;Bengaluru, India&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Focus&lt;/dt&gt;&lt;dd&gt;AI agents · Applied ML&lt;br&gt;Software engineering · Web3&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Working style&lt;/dt&gt;&lt;dd&gt;Product-minded&lt;br&gt;Evidence-led&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;/section&gt;

    &lt;article id=&quot;agentledger&quot; class=&quot;case-study reveal&quot; data-project&gt;&lt;div class=&quot;case-copy&quot;&gt;&lt;div class=&quot;case-kicker&quot;&gt;&lt;span&gt;01&lt;/span&gt;&lt;span&gt;AI Agents · FinTech&lt;/span&gt;&lt;/div&gt;&lt;h3&gt;AgentLedger&lt;/h3&gt;&lt;p class=&quot;case-summary&quot;&gt;An idempotent, x402-inspired Razorpay settlement gateway for autonomous AI agents.&lt;/p&gt;&lt;dl class=&quot;case-facts&quot;&gt;&lt;div&gt;&lt;dt&gt;Problem&lt;/dt&gt;&lt;dd&gt;Payment flows assume a human checkout and provide weak protection against duplicate agent retries.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;System&lt;/dt&gt;&lt;dd&gt;HTTP 402 challenges, budget checks, signed webhooks, a deterministic state machine, and a hash-chained audit ledger.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Status&lt;/dt&gt;&lt;dd&gt;Test-mode and mock-ready buildathon implementation; explicitly not presented as live-money production.&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class=&quot;tech-list&quot; aria-label=&quot;Technologies&quot;&gt;&lt;span&gt;Next.js 16&lt;/span&gt;&lt;span&gt;TypeScript&lt;/span&gt;&lt;span&gt;Prisma&lt;/span&gt;&lt;span&gt;SQLite&lt;/span&gt;&lt;span&gt;Razorpay&lt;/span&gt;&lt;span&gt;Tailwind CSS&lt;/span&gt;&lt;/div&gt;&lt;a class=&quot;project-link&quot; href=&quot;https://github.com/iamshivam017/AgentLedger&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;system-frame ledger-frame&quot; aria-label=&quot;AgentLedger payment flow diagram&quot;&gt;&lt;div class=&quot;frame-label&quot;&gt;&lt;span&gt;Settlement flow&lt;/span&gt;&lt;span&gt;Idempotent by design&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-canvas&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;flow-node&quot;&gt;&lt;small&gt;REQUEST&lt;/small&gt;&lt;strong&gt;AI Agent&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;flow-arrow&quot;&gt;&lt;span&gt;402&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-node focus&quot;&gt;&lt;small&gt;CONTROL&lt;/small&gt;&lt;strong&gt;Gateway&lt;/strong&gt;&lt;em&gt;budget · state · signature&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;flow-arrow&quot;&gt;&lt;span&gt;verify&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-stack&quot;&gt;&lt;div&gt;Razorpay&lt;/div&gt;&lt;div&gt;Ledger&lt;/div&gt;&lt;div&gt;Audit log&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;detail-toggle&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;agentledger-detail&quot;&gt;Engineering detail &lt;span aria-hidden=&quot;true&quot;&gt;+&lt;/span&gt;&lt;/button&gt;&lt;div id=&quot;agentledger-detail&quot; class=&quot;detail-panel&quot; hidden&gt;&lt;p&gt;Three idempotency layers protect settlement: database uniqueness, service-level guards, and webhook event deduplication. Raw-body HMAC verification protects the webhook boundary.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
    &lt;article id=&quot;agentshield&quot; class=&quot;case-study reverse reveal&quot; data-project&gt;&lt;div class=&quot;case-copy&quot;&gt;&lt;div class=&quot;case-kicker&quot;&gt;&lt;span&gt;02&lt;/span&gt;&lt;span&gt;Applied ML · Risk Systems&lt;/span&gt;&lt;/div&gt;&lt;h3&gt;AgentShield AI&lt;/h3&gt;&lt;p class=&quot;case-summary&quot;&gt;A defense-first risk and trust layer that evaluates autonomous-agent payments before money moves.&lt;/p&gt;&lt;dl class=&quot;case-facts&quot;&gt;&lt;div&gt;&lt;dt&gt;Problem&lt;/dt&gt;&lt;dd&gt;An agent can submit a technically valid payment that still violates its owner’s mandate or behavioral pattern.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;System&lt;/dt&gt;&lt;dd&gt;Behavioral features, calibrated anomaly modeling, deterministic policy enforcement, and explainable ALLOW, VERIFY, or BLOCK decisions.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Evidence&lt;/dt&gt;&lt;dd&gt;The repository documents a reproducible held-out synthetic benchmark and clearly labels it as synthetic—not customer data.&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class=&quot;tech-list&quot; aria-label=&quot;Technologies&quot;&gt;&lt;span&gt;Python&lt;/span&gt;&lt;span&gt;FastAPI&lt;/span&gt;&lt;span&gt;Machine Learning&lt;/span&gt;&lt;span&gt;Policy Engine&lt;/span&gt;&lt;span&gt;Docker&lt;/span&gt;&lt;/div&gt;&lt;a class=&quot;project-link&quot; href=&quot;https://github.com/iamshivam017/AgentShield-AI&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;system-frame risk-frame&quot; aria-label=&quot;AgentShield evaluation pipeline diagram&quot;&gt;&lt;div class=&quot;frame-label&quot;&gt;&lt;span&gt;Evaluation pipeline&lt;/span&gt;&lt;span&gt;Decision before settlement&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;risk-pipeline&quot; aria-hidden=&quot;true&quot;&gt;&lt;div&gt;&lt;small&gt;01&lt;/small&gt;&lt;strong&gt;Context&lt;/strong&gt;&lt;span&gt;agent · merchant · velocity&lt;/span&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div class=&quot;focus&quot;&gt;&lt;small&gt;02&lt;/small&gt;&lt;strong&gt;Risk model&lt;/strong&gt;&lt;span&gt;behavioral anomaly score&lt;/span&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div&gt;&lt;small&gt;03&lt;/small&gt;&lt;strong&gt;Policy&lt;/strong&gt;&lt;span&gt;deterministic thresholds&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;decision-strip&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;ALLOW&lt;/span&gt;&lt;span&gt;VERIFY&lt;/span&gt;&lt;span&gt;BLOCK&lt;/span&gt;&lt;/div&gt;&lt;button class=&quot;detail-toggle&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;agentshield-detail&quot;&gt;Engineering detail &lt;span aria-hidden=&quot;true&quot;&gt;+&lt;/span&gt;&lt;/button&gt;&lt;div id=&quot;agentshield-detail&quot; class=&quot;detail-panel&quot; hidden&gt;&lt;p&gt;The model contributes a risk signal; deterministic rules retain final authority. This separation keeps decisions auditable and prevents the model from directly moving money.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
    &lt;article id=&quot;credit-risk&quot; class=&quot;case-study reveal&quot; data-project&gt;&lt;div class=&quot;case-copy&quot;&gt;&lt;div class=&quot;case-kicker&quot;&gt;&lt;span&gt;03&lt;/span&gt;&lt;span&gt;Machine Learning · Explainability&lt;/span&gt;&lt;/div&gt;&lt;h3&gt;Credit Risk Predictor&lt;/h3&gt;&lt;p class=&quot;case-summary&quot;&gt;A reproducible ML pipeline that predicts loan approval priority while exposing a misleading data-leakage feature.&lt;/p&gt;&lt;dl class=&quot;case-facts&quot;&gt;&lt;div&gt;&lt;dt&gt;Problem&lt;/dt&gt;&lt;dd&gt;Bank and CIBIL records must be cleaned, merged, and modeled without relying on a feature unavailable in production.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;System&lt;/dt&gt;&lt;dd&gt;Two clearly labeled feature sets compare the leakage-inflated model with a deployable XGBoost model aligned to the holdout schema.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Product&lt;/dt&gt;&lt;dd&gt;A Streamlit dashboard supports single and batch prediction, model comparison, SHAP explainability, and the leakage investigation.&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class=&quot;tech-list&quot; aria-label=&quot;Technologies&quot;&gt;&lt;span&gt;Python&lt;/span&gt;&lt;span&gt;Pandas&lt;/span&gt;&lt;span&gt;XGBoost&lt;/span&gt;&lt;span&gt;SHAP&lt;/span&gt;&lt;span&gt;Streamlit&lt;/span&gt;&lt;span&gt;pytest&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;project-actions&quot;&gt;&lt;a class=&quot;project-link&quot; href=&quot;https://github.com/iamshivam017/Credit-Risk-Predictor&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;project-link&quot; href=&quot;https://credit-risks-prediction.streamlit.app/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Live demo &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;system-frame credit-frame&quot; aria-label=&quot;Credit risk machine learning pipeline diagram&quot;&gt;&lt;div class=&quot;frame-label&quot;&gt;&lt;span&gt;Data to decision&lt;/span&gt;&lt;span&gt;Leakage-aware pipeline&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ml-pipeline&quot; aria-hidden=&quot;true&quot;&gt;&lt;div&gt;&lt;small&gt;DATA&lt;/small&gt;&lt;strong&gt;Bank + CIBIL&lt;/strong&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div&gt;&lt;small&gt;CHECK&lt;/small&gt;&lt;strong&gt;Schema + leakage&lt;/strong&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div class=&quot;focus&quot;&gt;&lt;small&gt;MODEL&lt;/small&gt;&lt;strong&gt;XGBoost&lt;/strong&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div&gt;&lt;small&gt;EXPLAIN&lt;/small&gt;&lt;strong&gt;SHAP&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;model-note&quot;&gt;&lt;span&gt;51 features&lt;/span&gt;&lt;del&gt;Inflated by unavailable signal&lt;/del&gt;&lt;strong&gt;50 features&lt;/strong&gt;&lt;em&gt;Deployment-aligned model&lt;/em&gt;&lt;/div&gt;&lt;button class=&quot;detail-toggle&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;credit-detail&quot;&gt;Engineering detail &lt;span aria-hidden=&quot;true&quot;&gt;+&lt;/span&gt;&lt;/button&gt;&lt;div id=&quot;credit-detail&quot; class=&quot;detail-panel&quot; hidden&gt;&lt;p&gt;The project deliberately rejects the visually impressive 99.2% leakage-inflated result and uses the lower, reproducible deployment model for predictions. The repository documents limitations rather than hiding them.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
  &lt;/div&gt;&lt;/section&gt;
  &lt;section id=&quot;capabilities&quot; class=&quot;capabilities-section shell&quot; aria-labelledby=&quot;capabilities-title&quot;&gt;&lt;header class=&quot;section-intro compact&quot;&gt;&lt;div&gt;&lt;span class=&quot;section-number&quot;&gt;02&lt;/span&gt;&lt;h2 id=&quot;capabilities-title&quot;&gt;Capabilities grounded in projects.&lt;/h2&gt;&lt;/div&gt;&lt;p&gt;Technologies are useful when they connect to a real system. These are the areas repeatedly demonstrated across the work above.&lt;/p&gt;&lt;/header&gt;&lt;div class=&quot;capability-grid&quot;&gt;&lt;article&gt;&lt;span&gt;02.1&lt;/span&gt;&lt;h3&gt;AI Agents&lt;/h3&gt;&lt;p&gt;Workflows, tool use, orchestration, and agentic commerce.&lt;/p&gt;&lt;small&gt;AgentLedger · SafeSpend&lt;/small&gt;&lt;/article&gt;&lt;article&gt;&lt;span&gt;02.2&lt;/span&gt;&lt;h3&gt;AI / ML&lt;/h3&gt;&lt;p&gt;Machine learning, NLP, model integration, and explainability.&lt;/p&gt;&lt;small&gt;AgentShield · Credit Risk · ReviewLens&lt;/small&gt;&lt;/article&gt;&lt;article&gt;&lt;span&gt;02.3&lt;/span&gt;&lt;h3&gt;Software Engineering&lt;/h3&gt;&lt;p&gt;Full-stack applications, APIs, databases, frontend and backend systems.&lt;/p&gt;&lt;small&gt;Next.js · FastAPI · Python · TypeScript&lt;/small&gt;&lt;/article&gt;&lt;article&gt;&lt;span&gt;02.4&lt;/span&gt;&lt;h3&gt;Web3&lt;/h3&gt;&lt;p&gt;Blockchain applications, agentic payments, and protocol-oriented infrastructure.&lt;/p&gt;&lt;small&gt;x402 · Solana exploration · dApps&lt;/small&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;section id=&quot;experience&quot; class=&quot;experience-section&quot; aria-labelledby=&quot;experience-title&quot;&gt;&lt;div class=&quot;shell experience-inner&quot;&gt;&lt;div&gt;&lt;span class=&quot;section-number light&quot;&gt;03&lt;/span&gt;&lt;h2 id=&quot;experience-title&quot;&gt;Education &amp;amp;&lt;br&gt;development.&lt;/h2&gt;&lt;p&gt;Formal study and focused programs strengthening an applied engineering foundation.&lt;/p&gt;&lt;/div&gt;&lt;ol class=&quot;timeline&quot;&gt;&lt;li&gt;&lt;span&gt;2023—2027&lt;/span&gt;&lt;strong&gt;Indian Institute of Technology Guwahati&lt;/strong&gt;&lt;p&gt;B.Sc. in Data Science &amp;amp; AI&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span&gt;Currently enrolled&lt;/span&gt;&lt;strong&gt;AWS AI &amp;amp; ML Scholars&lt;/strong&gt;&lt;p&gt;Focused learning in artificial intelligence and machine learning.&lt;/p&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;section class=&quot;more-work shell&quot; aria-labelledby=&quot;more-work-title&quot;&gt;&lt;div class=&quot;section-row&quot;&gt;&lt;span class=&quot;section-number&quot;&gt;04&lt;/span&gt;&lt;h2 id=&quot;more-work-title&quot;&gt;Additional work&lt;/h2&gt;&lt;a href=&quot;https://github.com/iamshivam017?tab=repositories&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;GitHub archive &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;work-index-head&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;Project&lt;/span&gt;&lt;span&gt;Focus&lt;/span&gt;&lt;span&gt;Stack&lt;/span&gt;&lt;span&gt;Links&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;work-list&quot;&gt;&lt;article id=&quot;safespend&quot; class=&quot;work-row&quot;&gt;&lt;div&gt;&lt;span&gt;AI Agents · Personal Finance&lt;/span&gt;&lt;h3&gt;SafeSpend&lt;/h3&gt;&lt;/div&gt;&lt;p&gt;Evidence-aware affordability agent that evaluates cash flow, essential spending, and payment options before recommending proceed, wait, or decline.&lt;/p&gt;&lt;div class=&quot;compact-stack&quot; aria-label=&quot;Technologies&quot;&gt;Python · Agent workflows · Evidence processing · Tests&lt;/div&gt;&lt;div class=&quot;row-actions&quot;&gt;&lt;a href=&quot;https://github.com/iamshivam017/SafeSpend&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository ↗&lt;/a&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;work-row&quot;&gt;&lt;div&gt;&lt;span&gt;Applied NLP&lt;/span&gt;&lt;h3&gt;ReviewLens&lt;/h3&gt;&lt;/div&gt;&lt;p&gt;Sentiment analysis and insight dashboard trained on real customer-review data.&lt;/p&gt;&lt;div class=&quot;compact-stack&quot; aria-label=&quot;Technologies&quot;&gt;Python · NLP · Streamlit&lt;/div&gt;&lt;div class=&quot;row-actions&quot;&gt;&lt;a href=&quot;https://github.com/iamshivam017/ReviewLens&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository ↗&lt;/a&gt;&lt;a href=&quot;https://reviewlens-iitg.streamlit.app/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Live demo ↗&lt;/a&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;section id=&quot;about&quot; class=&quot;about-section shell&quot; aria-labelledby=&quot;about-title&quot;&gt;&lt;div&gt;&lt;span class=&quot;section-number&quot;&gt;05&lt;/span&gt;&lt;h2 id=&quot;about-title&quot;&gt;Building what’s next, responsibly.&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;about-copy&quot;&gt;&lt;p&gt;I’m Kumar Shivam, a B.Sc. Data Science &amp;amp; AI student at IIT Guwahati focused on AI/ML, software engineering, AI agents, and Web3.&lt;/p&gt;&lt;p&gt;I enjoy turning emerging technologies into working products—from agentic payment infrastructure and financial AI systems to full-stack software and decentralized systems. My approach is simple: understand the problem, make the system inspectable, and be honest about what the evidence proves.&lt;/p&gt;&lt;/div&gt;&lt;dl class=&quot;about-facts&quot;&gt;&lt;div&gt;&lt;dt&gt;Based in&lt;/dt&gt;&lt;dd&gt;Bengaluru, India&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Focus&lt;/dt&gt;&lt;dd&gt;AI agents · Applied ML&lt;br&gt;Software engineering · Web3&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Working style&lt;/dt&gt;&lt;dd&gt;Product-minded&lt;br&gt;Evidence-led&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;/section&gt;

    &lt;article id=&quot;agentledger&quot; class=&quot;case-study reveal&quot; data-project&gt;&lt;div class=&quot;case-copy&quot;&gt;&lt;div class=&quot;case-kicker&quot;&gt;&lt;span&gt;01&lt;/span&gt;&lt;span&gt;AI Agents · FinTech&lt;/span&gt;&lt;/div&gt;&lt;h3&gt;AgentLedger&lt;/h3&gt;&lt;p class=&quot;case-summary&quot;&gt;An idempotent, x402-inspired Razorpay settlement gateway for autonomous AI agents.&lt;/p&gt;&lt;dl class=&quot;case-facts&quot;&gt;&lt;div&gt;&lt;dt&gt;Problem&lt;/dt&gt;&lt;dd&gt;Payment flows assume a human checkout and provide weak protection against duplicate agent retries.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;System&lt;/dt&gt;&lt;dd&gt;HTTP 402 challenges, budget checks, signed webhooks, a deterministic state machine, and a hash-chained audit ledger.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Status&lt;/dt&gt;&lt;dd&gt;Test-mode and mock-ready buildathon implementation; explicitly not presented as live-money production.&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class=&quot;tech-list&quot; aria-label=&quot;Technologies&quot;&gt;&lt;span&gt;Next.js 16&lt;/span&gt;&lt;span&gt;TypeScript&lt;/span&gt;&lt;span&gt;Prisma&lt;/span&gt;&lt;span&gt;SQLite&lt;/span&gt;&lt;span&gt;Razorpay&lt;/span&gt;&lt;span&gt;Tailwind CSS&lt;/span&gt;&lt;/div&gt;&lt;a class=&quot;project-link&quot; href=&quot;https://github.com/iamshivam017/AgentLedger&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;system-frame ledger-frame&quot; aria-label=&quot;AgentLedger payment flow diagram&quot;&gt;&lt;div class=&quot;frame-label&quot;&gt;&lt;span&gt;Settlement flow&lt;/span&gt;&lt;span&gt;Idempotent by design&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-canvas&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;flow-node&quot;&gt;&lt;small&gt;REQUEST&lt;/small&gt;&lt;strong&gt;AI Agent&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;flow-arrow&quot;&gt;&lt;span&gt;402&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-node focus&quot;&gt;&lt;small&gt;CONTROL&lt;/small&gt;&lt;strong&gt;Gateway&lt;/strong&gt;&lt;em&gt;budget · state · signature&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;flow-arrow&quot;&gt;&lt;span&gt;verify&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-stack&quot;&gt;&lt;div&gt;Razorpay&lt;/div&gt;&lt;div&gt;Ledger&lt;/div&gt;&lt;div&gt;Audit log&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;detail-toggle&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;agentledger-detail&quot;&gt;Engineering detail &lt;span aria-hidden=&quot;true&quot;&gt;+&lt;/span&gt;&lt;/button&gt;&lt;div id=&quot;agentledger-detail&quot; class=&quot;detail-panel&quot; hidden&gt;&lt;p&gt;Three idempotency layers protect settlement: database uniqueness, service-level guards, and webhook event deduplication. Raw-body HMAC verification protects the webhook boundary.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
    &lt;article id=&quot;agentshield&quot; class=&quot;case-study reverse reveal&quot; data-project&gt;&lt;div class=&quot;case-copy&quot;&gt;&lt;div class=&quot;case-kicker&quot;&gt;&lt;span&gt;02&lt;/span&gt;&lt;span&gt;Applied ML · Risk Systems&lt;/span&gt;&lt;/div&gt;&lt;h3&gt;AgentShield AI&lt;/h3&gt;&lt;p class=&quot;case-summary&quot;&gt;A defense-first risk and trust layer that evaluates autonomous-agent payments before money moves.&lt;/p&gt;&lt;dl class=&quot;case-facts&quot;&gt;&lt;div&gt;&lt;dt&gt;Problem&lt;/dt&gt;&lt;dd&gt;An agent can submit a technically valid payment that still violates its owner’s mandate or behavioral pattern.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;System&lt;/dt&gt;&lt;dd&gt;Behavioral features, calibrated anomaly modeling, deterministic policy enforcement, and explainable ALLOW, VERIFY, or BLOCK decisions.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Evidence&lt;/dt&gt;&lt;dd&gt;The repository documents a reproducible held-out synthetic benchmark and clearly labels it as synthetic—not customer data.&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class=&quot;tech-list&quot; aria-label=&quot;Technologies&quot;&gt;&lt;span&gt;Python&lt;/span&gt;&lt;span&gt;FastAPI&lt;/span&gt;&lt;span&gt;Machine Learning&lt;/span&gt;&lt;span&gt;Policy Engine&lt;/span&gt;&lt;span&gt;Docker&lt;/span&gt;&lt;/div&gt;&lt;a class=&quot;project-link&quot; href=&quot;https://github.com/iamshivam017/AgentShield-AI&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;system-frame risk-frame&quot; aria-label=&quot;AgentShield evaluation pipeline diagram&quot;&gt;&lt;div class=&quot;frame-label&quot;&gt;&lt;span&gt;Evaluation pipeline&lt;/span&gt;&lt;span&gt;Decision before settlement&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;risk-pipeline&quot; aria-hidden=&quot;true&quot;&gt;&lt;div&gt;&lt;small&gt;01&lt;/small&gt;&lt;strong&gt;Context&lt;/strong&gt;&lt;span&gt;agent · merchant · velocity&lt;/span&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div class=&quot;focus&quot;&gt;&lt;small&gt;02&lt;/small&gt;&lt;strong&gt;Risk model&lt;/strong&gt;&lt;span&gt;behavioral anomaly score&lt;/span&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div&gt;&lt;small&gt;03&lt;/small&gt;&lt;strong&gt;Policy&lt;/strong&gt;&lt;span&gt;deterministic thresholds&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;decision-strip&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;ALLOW&lt;/span&gt;&lt;span&gt;VERIFY&lt;/span&gt;&lt;span&gt;BLOCK&lt;/span&gt;&lt;/div&gt;&lt;button class=&quot;detail-toggle&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;agentshield-detail&quot;&gt;Engineering detail &lt;span aria-hidden=&quot;true&quot;&gt;+&lt;/span&gt;&lt;/button&gt;&lt;div id=&quot;agentshield-detail&quot; class=&quot;detail-panel&quot; hidden&gt;&lt;p&gt;The model contributes a risk signal; deterministic rules retain final authority. This separation keeps decisions auditable and prevents the model from directly moving money.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
    &lt;article id=&quot;credit-risk&quot; class=&quot;case-study reveal&quot; data-project&gt;&lt;div class=&quot;case-copy&quot;&gt;&lt;div class=&quot;case-kicker&quot;&gt;&lt;span&gt;03&lt;/span&gt;&lt;span&gt;Machine Learning · Explainability&lt;/span&gt;&lt;/div&gt;&lt;h3&gt;Credit Risk Predictor&lt;/h3&gt;&lt;p class=&quot;case-summary&quot;&gt;A reproducible ML pipeline that predicts loan approval priority while exposing a misleading data-leakage feature.&lt;/p&gt;&lt;dl class=&quot;case-facts&quot;&gt;&lt;div&gt;&lt;dt&gt;Problem&lt;/dt&gt;&lt;dd&gt;Bank and CIBIL records must be cleaned, merged, and modeled without relying on a feature unavailable in production.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;System&lt;/dt&gt;&lt;dd&gt;Two clearly labeled feature sets compare the leakage-inflated model with a deployable XGBoost model aligned to the holdout schema.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Product&lt;/dt&gt;&lt;dd&gt;A Streamlit dashboard supports single and batch prediction, model comparison, SHAP explainability, and the leakage investigation.&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class=&quot;tech-list&quot; aria-label=&quot;Technologies&quot;&gt;&lt;span&gt;Python&lt;/span&gt;&lt;span&gt;Pandas&lt;/span&gt;&lt;span&gt;XGBoost&lt;/span&gt;&lt;span&gt;SHAP&lt;/span&gt;&lt;span&gt;Streamlit&lt;/span&gt;&lt;span&gt;pytest&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;project-actions&quot;&gt;&lt;a class=&quot;project-link&quot; href=&quot;https://github.com/iamshivam017/Credit-Risk-Predictor&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;project-link&quot; href=&quot;https://credit-risks-prediction.streamlit.app/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Live demo &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;system-frame credit-frame&quot; aria-label=&quot;Credit risk machine learning pipeline diagram&quot;&gt;&lt;div class=&quot;frame-label&quot;&gt;&lt;span&gt;Data to decision&lt;/span&gt;&lt;span&gt;Leakage-aware pipeline&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ml-pipeline&quot; aria-hidden=&quot;true&quot;&gt;&lt;div&gt;&lt;small&gt;DATA&lt;/small&gt;&lt;strong&gt;Bank + CIBIL&lt;/strong&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div&gt;&lt;small&gt;CHECK&lt;/small&gt;&lt;strong&gt;Schema + leakage&lt;/strong&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div class=&quot;focus&quot;&gt;&lt;small&gt;MODEL&lt;/small&gt;&lt;strong&gt;XGBoost&lt;/strong&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div&gt;&lt;small&gt;EXPLAIN&lt;/small&gt;&lt;strong&gt;SHAP&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;model-note&quot;&gt;&lt;span&gt;51 features&lt;/span&gt;&lt;del&gt;Inflated by unavailable signal&lt;/del&gt;&lt;strong&gt;50 features&lt;/strong&gt;&lt;em&gt;Deployment-aligned model&lt;/em&gt;&lt;/div&gt;&lt;button class=&quot;detail-toggle&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;credit-detail&quot;&gt;Engineering detail &lt;span aria-hidden=&quot;true&quot;&gt;+&lt;/span&gt;&lt;/button&gt;&lt;div id=&quot;credit-detail&quot; class=&quot;detail-panel&quot; hidden&gt;&lt;p&gt;The project deliberately rejects the visually impressive 99.2% leakage-inflated result and uses the lower, reproducible deployment model for predictions. The repository documents limitations rather than hiding them.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
  &lt;/div&gt;&lt;/section&gt;
  &lt;section id=&quot;capabilities&quot; class=&quot;capabilities-section shell&quot; aria-labelledby=&quot;capabilities-title&quot;&gt;&lt;header class=&quot;section-intro compact&quot;&gt;&lt;div&gt;&lt;span class=&quot;section-number&quot;&gt;02&lt;/span&gt;&lt;h2 id=&quot;capabilities-title&quot;&gt;Capabilities grounded in projects.&lt;/h2&gt;&lt;/div&gt;&lt;p&gt;Technologies are useful when they connect to a real system. These are the areas repeatedly demonstrated across the work above.&lt;/p&gt;&lt;/header&gt;&lt;div class=&quot;capability-grid&quot;&gt;&lt;article&gt;&lt;span&gt;02.1&lt;/span&gt;&lt;h3&gt;AI Agents&lt;/h3&gt;&lt;p&gt;Workflows, tool use, orchestration, and agentic commerce.&lt;/p&gt;&lt;small&gt;AgentLedger · SafeSpend&lt;/small&gt;&lt;/article&gt;&lt;article&gt;&lt;span&gt;02.2&lt;/span&gt;&lt;h3&gt;AI / ML&lt;/h3&gt;&lt;p&gt;Machine learning, NLP, model integration, and explainability.&lt;/p&gt;&lt;small&gt;AgentShield · Credit Risk · ReviewLens&lt;/small&gt;&lt;/article&gt;&lt;article&gt;&lt;span&gt;02.3&lt;/span&gt;&lt;h3&gt;Software Engineering&lt;/h3&gt;&lt;p&gt;Full-stack applications, APIs, databases, frontend and backend systems.&lt;/p&gt;&lt;small&gt;Next.js · FastAPI · Python · TypeScript&lt;/small&gt;&lt;/article&gt;&lt;article&gt;&lt;span&gt;02.4&lt;/span&gt;&lt;h3&gt;Web3&lt;/h3&gt;&lt;p&gt;Blockchain applications, agentic payments, and protocol-oriented infrastructure.&lt;/p&gt;&lt;small&gt;x402 · Solana exploration · dApps&lt;/small&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;section id=&quot;experience&quot; class=&quot;experience-section&quot; aria-labelledby=&quot;experience-title&quot;&gt;&lt;div class=&quot;shell experience-inner&quot;&gt;&lt;div&gt;&lt;span class=&quot;section-number light&quot;&gt;03&lt;/span&gt;&lt;h2 id=&quot;experience-title&quot;&gt;Education &amp;amp;&lt;br&gt;development.&lt;/h2&gt;&lt;p&gt;Formal study and focused programs strengthening an applied engineering foundation.&lt;/p&gt;&lt;/div&gt;&lt;ol class=&quot;timeline&quot;&gt;&lt;li&gt;&lt;span&gt;2023—2027&lt;/span&gt;&lt;strong&gt;Indian Institute of Technology Guwahati&lt;/strong&gt;&lt;p&gt;B.Sc. in Data Science &amp;amp; AI&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span&gt;Currently enrolled&lt;/span&gt;&lt;strong&gt;AWS AI &amp;amp; ML Scholars&lt;/strong&gt;&lt;p&gt;Focused learning in artificial intelligence and machine learning.&lt;/p&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;section class=&quot;more-work shell&quot; aria-labelledby=&quot;more-work-title&quot;&gt;&lt;div class=&quot;section-row&quot;&gt;&lt;span class=&quot;section-number&quot;&gt;04&lt;/span&gt;&lt;h2 id=&quot;more-work-title&quot;&gt;Additional work&lt;/h2&gt;&lt;a href=&quot;https://github.com/iamshivam017?tab=repositories&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;GitHub archive &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;work-index-head&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;Project&lt;/span&gt;&lt;span&gt;Focus&lt;/span&gt;&lt;span&gt;Stack&lt;/span&gt;&lt;span&gt;Links&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;work-list&quot;&gt;&lt;article id=&quot;safespend&quot; class=&quot;work-row&quot;&gt;&lt;div&gt;&lt;span&gt;AI Agents · Personal Finance&lt;/span&gt;&lt;h3&gt;SafeSpend&lt;/h3&gt;&lt;/div&gt;&lt;p&gt;Evidence-aware affordability agent that evaluates cash flow, essential spending, and payment options before recommending proceed, wait, or decline.&lt;/p&gt;&lt;div class=&quot;compact-stack&quot; aria-label=&quot;Technologies&quot;&gt;Python · Agent workflows · Evidence processing · Tests&lt;/div&gt;&lt;div class=&quot;row-actions&quot;&gt;&lt;a href=&quot;https://github.com/iamshivam017/SafeSpend&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository ↗&lt;/a&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;work-row&quot;&gt;&lt;div&gt;&lt;span&gt;Applied NLP&lt;/span&gt;&lt;h3&gt;ReviewLens&lt;/h3&gt;&lt;/div&gt;&lt;p&gt;Sentiment analysis and insight dashboard trained on real customer-review data.&lt;/p&gt;&lt;div class=&quot;compact-stack&quot; aria-label=&quot;Technologies&quot;&gt;Python · NLP · Streamlit&lt;/div&gt;&lt;div class=&quot;row-actions&quot;&gt;&lt;a href=&quot;https://github.com/iamshivam017/ReviewLens&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository ↗&lt;/a&gt;&lt;a href=&quot;https://reviewlens-iitg.streamlit.app/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Live demo ↗&lt;/a&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;section id=&quot;about&quot; class=&quot;about-section shell&quot; aria-labelledby=&quot;about-title&quot;&gt;&lt;div&gt;&lt;span class=&quot;section-number&quot;&gt;05&lt;/span&gt;&lt;h2 id=&quot;about-title&quot;&gt;Building what’s next, responsibly.&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;about-copy&quot;&gt;&lt;p&gt;I’m Kumar Shivam, a B.Sc. Data Science &amp;amp; AI student at IIT Guwahati focused on AI/ML, software engineering, AI agents, and Web3.&lt;/p&gt;&lt;p&gt;I enjoy turning emerging technologies into working products—from agentic payment infrastructure and financial AI systems to full-stack software and decentralized systems. My approach is simple: understand the problem, make the system inspectable, and be honest about what the evidence proves.&lt;/p&gt;&lt;/div&gt;&lt;dl class=&quot;about-facts&quot;&gt;&lt;div&gt;&lt;dt&gt;Based in&lt;/dt&gt;&lt;dd&gt;Bengaluru, India&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Focus&lt;/dt&gt;&lt;dd&gt;AI agents · Applied ML&lt;br&gt;Software engineering · Web3&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Working style&lt;/dt&gt;&lt;dd&gt;Product-minded&lt;br&gt;Evidence-led&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;/section&gt;

    &lt;article id=&quot;agentledger&quot; class=&quot;case-study reveal&quot; data-project&gt;&lt;div class=&quot;case-copy&quot;&gt;&lt;div class=&quot;case-kicker&quot;&gt;&lt;span&gt;01&lt;/span&gt;&lt;span&gt;AI Agents · FinTech&lt;/span&gt;&lt;/div&gt;&lt;h3&gt;AgentLedger&lt;/h3&gt;&lt;p class=&quot;case-summary&quot;&gt;An idempotent, x402-inspired Razorpay settlement gateway for autonomous AI agents.&lt;/p&gt;&lt;dl class=&quot;case-facts&quot;&gt;&lt;div&gt;&lt;dt&gt;Problem&lt;/dt&gt;&lt;dd&gt;Payment flows assume a human checkout and provide weak protection against duplicate agent retries.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;System&lt;/dt&gt;&lt;dd&gt;HTTP 402 challenges, budget checks, signed webhooks, a deterministic state machine, and a hash-chained audit ledger.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Status&lt;/dt&gt;&lt;dd&gt;Test-mode and mock-ready buildathon implementation; explicitly not presented as live-money production.&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class=&quot;tech-list&quot; aria-label=&quot;Technologies&quot;&gt;&lt;span&gt;Next.js 16&lt;/span&gt;&lt;span&gt;TypeScript&lt;/span&gt;&lt;span&gt;Prisma&lt;/span&gt;&lt;span&gt;SQLite&lt;/span&gt;&lt;span&gt;Razorpay&lt;/span&gt;&lt;span&gt;Tailwind CSS&lt;/span&gt;&lt;/div&gt;&lt;a class=&quot;project-link&quot; href=&quot;https://github.com/iamshivam017/AgentLedger&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;system-frame ledger-frame&quot; aria-label=&quot;AgentLedger payment flow diagram&quot;&gt;&lt;div class=&quot;frame-label&quot;&gt;&lt;span&gt;Settlement flow&lt;/span&gt;&lt;span&gt;Idempotent by design&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-canvas&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;flow-node&quot;&gt;&lt;small&gt;REQUEST&lt;/small&gt;&lt;strong&gt;AI Agent&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;flow-arrow&quot;&gt;&lt;span&gt;402&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-node focus&quot;&gt;&lt;small&gt;CONTROL&lt;/small&gt;&lt;strong&gt;Gateway&lt;/strong&gt;&lt;em&gt;budget · state · signature&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;flow-arrow&quot;&gt;&lt;span&gt;verify&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;flow-stack&quot;&gt;&lt;div&gt;Razorpay&lt;/div&gt;&lt;div&gt;Ledger&lt;/div&gt;&lt;div&gt;Audit log&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;detail-toggle&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;agentledger-detail&quot;&gt;Engineering detail &lt;span aria-hidden=&quot;true&quot;&gt;+&lt;/span&gt;&lt;/button&gt;&lt;div id=&quot;agentledger-detail&quot; class=&quot;detail-panel&quot; hidden&gt;&lt;p&gt;Three idempotency layers protect settlement: database uniqueness, service-level guards, and webhook event deduplication. Raw-body HMAC verification protects the webhook boundary.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
    &lt;article id=&quot;agentshield&quot; class=&quot;case-study reverse reveal&quot; data-project&gt;&lt;div class=&quot;case-copy&quot;&gt;&lt;div class=&quot;case-kicker&quot;&gt;&lt;span&gt;02&lt;/span&gt;&lt;span&gt;Applied ML · Risk Systems&lt;/span&gt;&lt;/div&gt;&lt;h3&gt;AgentShield AI&lt;/h3&gt;&lt;p class=&quot;case-summary&quot;&gt;A defense-first risk and trust layer that evaluates autonomous-agent payments before money moves.&lt;/p&gt;&lt;dl class=&quot;case-facts&quot;&gt;&lt;div&gt;&lt;dt&gt;Problem&lt;/dt&gt;&lt;dd&gt;An agent can submit a technically valid payment that still violates its owner’s mandate or behavioral pattern.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;System&lt;/dt&gt;&lt;dd&gt;Behavioral features, calibrated anomaly modeling, deterministic policy enforcement, and explainable ALLOW, VERIFY, or BLOCK decisions.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Evidence&lt;/dt&gt;&lt;dd&gt;The repository documents a reproducible held-out synthetic benchmark and clearly labels it as synthetic—not customer data.&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class=&quot;tech-list&quot; aria-label=&quot;Technologies&quot;&gt;&lt;span&gt;Python&lt;/span&gt;&lt;span&gt;FastAPI&lt;/span&gt;&lt;span&gt;Machine Learning&lt;/span&gt;&lt;span&gt;Policy Engine&lt;/span&gt;&lt;span&gt;Docker&lt;/span&gt;&lt;/div&gt;&lt;a class=&quot;project-link&quot; href=&quot;https://github.com/iamshivam017/AgentShield-AI&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;system-frame risk-frame&quot; aria-label=&quot;AgentShield evaluation pipeline diagram&quot;&gt;&lt;div class=&quot;frame-label&quot;&gt;&lt;span&gt;Evaluation pipeline&lt;/span&gt;&lt;span&gt;Decision before settlement&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;risk-pipeline&quot; aria-hidden=&quot;true&quot;&gt;&lt;div&gt;&lt;small&gt;01&lt;/small&gt;&lt;strong&gt;Context&lt;/strong&gt;&lt;span&gt;agent · merchant · velocity&lt;/span&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div class=&quot;focus&quot;&gt;&lt;small&gt;02&lt;/small&gt;&lt;strong&gt;Risk model&lt;/strong&gt;&lt;span&gt;behavioral anomaly score&lt;/span&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div&gt;&lt;small&gt;03&lt;/small&gt;&lt;strong&gt;Policy&lt;/strong&gt;&lt;span&gt;deterministic thresholds&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;decision-strip&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;ALLOW&lt;/span&gt;&lt;span&gt;VERIFY&lt;/span&gt;&lt;span&gt;BLOCK&lt;/span&gt;&lt;/div&gt;&lt;button class=&quot;detail-toggle&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;agentshield-detail&quot;&gt;Engineering detail &lt;span aria-hidden=&quot;true&quot;&gt;+&lt;/span&gt;&lt;/button&gt;&lt;div id=&quot;agentshield-detail&quot; class=&quot;detail-panel&quot; hidden&gt;&lt;p&gt;The model contributes a risk signal; deterministic rules retain final authority. This separation keeps decisions auditable and prevents the model from directly moving money.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
    &lt;article id=&quot;credit-risk&quot; class=&quot;case-study reveal&quot; data-project&gt;&lt;div class=&quot;case-copy&quot;&gt;&lt;div class=&quot;case-kicker&quot;&gt;&lt;span&gt;03&lt;/span&gt;&lt;span&gt;Machine Learning · Explainability&lt;/span&gt;&lt;/div&gt;&lt;h3&gt;Credit Risk Predictor&lt;/h3&gt;&lt;p class=&quot;case-summary&quot;&gt;A reproducible ML pipeline that predicts loan approval priority while exposing a misleading data-leakage feature.&lt;/p&gt;&lt;dl class=&quot;case-facts&quot;&gt;&lt;div&gt;&lt;dt&gt;Problem&lt;/dt&gt;&lt;dd&gt;Bank and CIBIL records must be cleaned, merged, and modeled without relying on a feature unavailable in production.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;System&lt;/dt&gt;&lt;dd&gt;Two clearly labeled feature sets compare the leakage-inflated model with a deployable XGBoost model aligned to the holdout schema.&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Product&lt;/dt&gt;&lt;dd&gt;A Streamlit dashboard supports single and batch prediction, model comparison, SHAP explainability, and the leakage investigation.&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;div class=&quot;tech-list&quot; aria-label=&quot;Technologies&quot;&gt;&lt;span&gt;Python&lt;/span&gt;&lt;span&gt;Pandas&lt;/span&gt;&lt;span&gt;XGBoost&lt;/span&gt;&lt;span&gt;SHAP&lt;/span&gt;&lt;span&gt;Streamlit&lt;/span&gt;&lt;span&gt;pytest&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;project-actions&quot;&gt;&lt;a class=&quot;project-link&quot; href=&quot;https://github.com/iamshivam017/Credit-Risk-Predictor&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;project-link&quot; href=&quot;https://credit-risks-prediction.streamlit.app/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Live demo &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;system-frame credit-frame&quot; aria-label=&quot;Credit risk machine learning pipeline diagram&quot;&gt;&lt;div class=&quot;frame-label&quot;&gt;&lt;span&gt;Data to decision&lt;/span&gt;&lt;span&gt;Leakage-aware pipeline&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ml-pipeline&quot; aria-hidden=&quot;true&quot;&gt;&lt;div&gt;&lt;small&gt;DATA&lt;/small&gt;&lt;strong&gt;Bank + CIBIL&lt;/strong&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div&gt;&lt;small&gt;CHECK&lt;/small&gt;&lt;strong&gt;Schema + leakage&lt;/strong&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div class=&quot;focus&quot;&gt;&lt;small&gt;MODEL&lt;/small&gt;&lt;strong&gt;XGBoost&lt;/strong&gt;&lt;/div&gt;&lt;i&gt;→&lt;/i&gt;&lt;div&gt;&lt;small&gt;EXPLAIN&lt;/small&gt;&lt;strong&gt;SHAP&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;model-note&quot;&gt;&lt;span&gt;51 features&lt;/span&gt;&lt;del&gt;Inflated by unavailable signal&lt;/del&gt;&lt;strong&gt;50 features&lt;/strong&gt;&lt;em&gt;Deployment-aligned model&lt;/em&gt;&lt;/div&gt;&lt;button class=&quot;detail-toggle&quot; type=&quot;button&quot; aria-expanded=&quot;false&quot; aria-controls=&quot;credit-detail&quot;&gt;Engineering detail &lt;span aria-hidden=&quot;true&quot;&gt;+&lt;/span&gt;&lt;/button&gt;&lt;div id=&quot;credit-detail&quot; class=&quot;detail-panel&quot; hidden&gt;&lt;p&gt;The project deliberately rejects the visually impressive 99.2% leakage-inflated result and uses the lower, reproducible deployment model for predictions. The repository documents limitations rather than hiding them.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
  &lt;/div&gt;&lt;/section&gt;
  &lt;section id=&quot;capabilities&quot; class=&quot;capabilities-section shell&quot; aria-labelledby=&quot;capabilities-title&quot;&gt;&lt;header class=&quot;section-intro compact&quot;&gt;&lt;div&gt;&lt;span class=&quot;section-number&quot;&gt;02&lt;/span&gt;&lt;h2 id=&quot;capabilities-title&quot;&gt;Capabilities grounded in projects.&lt;/h2&gt;&lt;/div&gt;&lt;p&gt;Technologies are useful when they connect to a real system. These are the areas repeatedly demonstrated across the work above.&lt;/p&gt;&lt;/header&gt;&lt;div class=&quot;capability-grid&quot;&gt;&lt;article&gt;&lt;span&gt;02.1&lt;/span&gt;&lt;h3&gt;AI Agents&lt;/h3&gt;&lt;p&gt;Workflows, tool use, orchestration, and agentic commerce.&lt;/p&gt;&lt;small&gt;AgentLedger · SafeSpend&lt;/small&gt;&lt;/article&gt;&lt;article&gt;&lt;span&gt;02.2&lt;/span&gt;&lt;h3&gt;AI / ML&lt;/h3&gt;&lt;p&gt;Machine learning, NLP, model integration, and explainability.&lt;/p&gt;&lt;small&gt;AgentShield · Credit Risk · ReviewLens&lt;/small&gt;&lt;/article&gt;&lt;article&gt;&lt;span&gt;02.3&lt;/span&gt;&lt;h3&gt;Software Engineering&lt;/h3&gt;&lt;p&gt;Full-stack applications, APIs, databases, frontend and backend systems.&lt;/p&gt;&lt;small&gt;Next.js · FastAPI · Python · TypeScript&lt;/small&gt;&lt;/article&gt;&lt;article&gt;&lt;span&gt;02.4&lt;/span&gt;&lt;h3&gt;Web3&lt;/h3&gt;&lt;p&gt;Blockchain applications, agentic payments, and protocol-oriented infrastructure.&lt;/p&gt;&lt;small&gt;x402 · Solana exploration · dApps&lt;/small&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;section id=&quot;experience&quot; class=&quot;experience-section&quot; aria-labelledby=&quot;experience-title&quot;&gt;&lt;div class=&quot;shell experience-inner&quot;&gt;&lt;div&gt;&lt;span class=&quot;section-number light&quot;&gt;03&lt;/span&gt;&lt;h2 id=&quot;experience-title&quot;&gt;Education &amp;amp;&lt;br&gt;development.&lt;/h2&gt;&lt;p&gt;Formal study and focused programs strengthening an applied engineering foundation.&lt;/p&gt;&lt;/div&gt;&lt;ol class=&quot;timeline&quot;&gt;&lt;li&gt;&lt;span&gt;2023—2027&lt;/span&gt;&lt;strong&gt;Indian Institute of Technology Guwahati&lt;/strong&gt;&lt;p&gt;B.Sc. in Data Science &amp;amp; AI&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;span&gt;Currently enrolled&lt;/span&gt;&lt;strong&gt;AWS AI &amp;amp; ML Scholars&lt;/strong&gt;&lt;p&gt;Focused learning in artificial intelligence and machine learning.&lt;/p&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;section class=&quot;more-work shell&quot; aria-labelledby=&quot;more-work-title&quot;&gt;&lt;div class=&quot;section-row&quot;&gt;&lt;span class=&quot;section-number&quot;&gt;04&lt;/span&gt;&lt;h2 id=&quot;more-work-title&quot;&gt;Additional work&lt;/h2&gt;&lt;a href=&quot;https://github.com/iamshivam017?tab=repositories&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;GitHub archive &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;work-index-head&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;Project&lt;/span&gt;&lt;span&gt;Focus&lt;/span&gt;&lt;span&gt;Stack&lt;/span&gt;&lt;span&gt;Links&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;work-list&quot;&gt;&lt;article id=&quot;safespend&quot; class=&quot;work-row&quot;&gt;&lt;div&gt;&lt;span&gt;AI Agents · Personal Finance&lt;/span&gt;&lt;h3&gt;SafeSpend&lt;/h3&gt;&lt;/div&gt;&lt;p&gt;Evidence-aware affordability agent that evaluates cash flow, essential spending, and payment options before recommending proceed, wait, or decline.&lt;/p&gt;&lt;div class=&quot;compact-stack&quot; aria-label=&quot;Technologies&quot;&gt;Python · Agent workflows · Evidence processing · Tests&lt;/div&gt;&lt;div class=&quot;row-actions&quot;&gt;&lt;a href=&quot;https://github.com/iamshivam017/SafeSpend&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository ↗&lt;/a&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;work-row&quot;&gt;&lt;div&gt;&lt;span&gt;Applied NLP&lt;/span&gt;&lt;h3&gt;ReviewLens&lt;/h3&gt;&lt;/div&gt;&lt;p&gt;Sentiment analysis and insight dashboard trained on real customer-review data.&lt;/p&gt;&lt;div class=&quot;compact-stack&quot; aria-label=&quot;Technologies&quot;&gt;Python · NLP · Streamlit&lt;/div&gt;&lt;div class=&quot;row-actions&quot;&gt;&lt;a href=&quot;https://github.com/iamshivam017/ReviewLens&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Repository ↗&lt;/a&gt;&lt;a href=&quot;https://reviewlens-iitg.streamlit.app/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Live demo ↗&lt;/a&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;
  &lt;section id=&quot;about&quot; class=&quot;about-section shell&quot; aria-labelledby=&quot;about-title&quot;&gt;&lt;div&gt;&lt;span class=&quot;section-number&quot;&gt;05&lt;/span&gt;&lt;h2 id=&quot;about-title&quot;&gt;Building what’s next, responsibly.&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;about-copy&quot;&gt;&lt;p&gt;I’m Kumar Shivam, a B.Sc. Data Science &amp;amp; AI student at IIT Guwahati focused on AI/ML, software engineering, AI agents, and Web3.&lt;/p&gt;&lt;p&gt;I enjoy turning emerging technologies into working products—from agentic payment infrastructure and financial AI systems to full-stack software and decentralized systems. My approach is simple: understand the problem, make the system inspectable, and be honest about what the evidence proves.&lt;/p&gt;&lt;/div&gt;&lt;dl class=&quot;about-facts&quot;&gt;&lt;div&gt;&lt;dt&gt;Based in&lt;/dt&gt;&lt;dd&gt;Bengaluru, India&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Focus&lt;/dt&gt;&lt;dd&gt;AI agents · Applied ML&lt;br&gt;Software engineering · Web3&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;Working style&lt;/dt&gt;&lt;dd&gt;Product-minded&lt;br&gt;Evidence-led&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;/section&gt;
